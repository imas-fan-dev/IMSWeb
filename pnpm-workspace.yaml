packages:
  - apps/api
  - apps/web
  - packages/contracts

verifyDepsBeforeRun: warn
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@tiptap/core@3.30.6"
  - "@tiptap/pm@3.30.6"
  - "fast-uri@3.1.7"
  - "qs@6.16.0"
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - "chokidar@4.0.3"
  - "semver@6.3.1"
  - "undici-types@6.21.0"

overrides:
  "@hono/node-server@<1.19.15": 1.19.15
  "@tiptap/core@>=3.0.0 <3.30.6": 3.30.6
  "@tiptap/pm@>=3.0.0 <3.30.6": 3.30.6
  "body-parser@<1.20.6": 1.20.6
  "brace-expansion@>=2.0.0 <3.0.0": 2.1.4
  "brace-expansion@>=4.0.0 <5.0.9": 5.0.9
  "browserslist@>=4.0.0 <4.28.8": 4.28.8
  "esbuild@>=0.27.3 <0.28.1": 0.28.1
  "fast-uri@>=3.0.0 <3.1.7": 3.1.7
  "ini@>=1.0.0 <1.3.8": 1.3.8
  "ip-address@<=10.3.0": 10.3.1
  "js-yaml@>=4.0.0 <4.3.1": 4.3.1
  "morgan@>=1.2.0 <=1.10.1": 1.11.0
  "nanoid@>=3.0.0 <3.3.18": 3.3.18
  "postcss@<=8.5.22": 8.5.26
  "qs@>=6.0.0 <6.16.0": 6.16.0
  sharp: 0.35.3
  "undici@>=7.0.0 <7.29.0": 7.29.0
  zod: 3.25.76

allowBuilds:
  bcrypt: true
  esbuild: true
  msw: false
  sharp: true
  sqlite3: true
  workerd: true
