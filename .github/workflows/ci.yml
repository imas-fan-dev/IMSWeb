name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - release/v1.1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/release/v1.1' && github.run_id || 'latest' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected workspaces
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      repo: ${{ steps.affected.outputs.repo }}
      app: ${{ steps.affected.outputs.app }}
      web: ${{ steps.affected.outputs.web }}
      api: ${{ steps.affected.outputs.api }}
      integration: ${{ steps.affected.outputs.integration }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Detect affected workspaces
        id: affected
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/release/v1.1" && "$CI_EVENT_NAME" == "push" ]]; then
            printf 'repo=true\napp=true\nweb=true\napi=true\nintegration=true\n' >> "$GITHUB_OUTPUT"
          else
            node scripts/ci/detect-affected-workspaces.mjs
          fi

  repository:
    name: Validate repository and infrastructure
    needs: changes
    if: needs.changes.outputs.repo == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0
          run_install: false

      - name: Restore pnpm store
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks
        run: pnpm run check:root

      - name: Test governance owner
        run: node scripts/testing/run-test-owner.mjs governance

      - name: Test contracts owner
        run: node scripts/testing/run-test-owner.mjs contracts

      - name: Test repository delivery contracts
        run: node scripts/testing/run-test-owner.mjs delivery repository

      - name: Upload repository reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repository-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/junit-repository.xml
          if-no-files-found: ignore
          retention-days: 7

  app:
    name: Validate App
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0
          run_install: false

      - name: Restore pnpm store
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test App delivery contracts
        run: node scripts/testing/run-test-owner.mjs delivery app

      - name: Test App build scripts
        run: pnpm --filter @imsweb/web run test:unit tests/unit/scripts/build-app.test.ts

      - name: Install App browsers
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          pnpm --filter @imsweb/web exec playwright install --with-deps chromium webkit

      - name: Build App target
        run: pnpm --filter @imsweb/web run build:app
        env:
          VITE_IMS_API_ORIGIN: http://127.0.0.1:1420
          VITE_IMS_PUBLIC_SITE_ORIGIN: http://localhost:1420

      - name: Record and verify App candidate
        env:
          VITE_IMS_API_ORIGIN: http://127.0.0.1:1420
          VITE_IMS_PUBLIC_SITE_ORIGIN: http://localhost:1420
        run: |
          node scripts/ci/build-artifact.mjs record app
          node scripts/ci/build-artifact.mjs verify app

      - name: Test App in browsers
        run: pnpm --filter @imsweb/web run test:e2e:app

      - name: Upload App browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/imsweb-app-playwright
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Validate Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0
          run_install: false

      - name: Restore pnpm store
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Web delivery contracts
        run: node scripts/testing/run-test-owner.mjs delivery web

      - name: Test Web owner
        run: node scripts/testing/run-test-owner.mjs web validation
        env:
          # This profile owns the complete Web unit domain.
          IMS_TEST_COVERAGE_ENABLED: "true"

      - name: Upload Web reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/reports/junit-web.xml
            apps/web/coverage
          if-no-files-found: ignore
          retention-days: 7

  web-build:
    name: Build Web candidate
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0
          run_install: false
      - name: Restore pnpm store
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Web target
        run: pnpm --filter @imsweb/web run build
      - name: Record Web candidate identity
        run: node scripts/ci/build-artifact.mjs record web
      - name: Upload Web candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/build
            .ci-artifacts/web.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  web-browser:
    name: Validate Web browsers
    needs: [changes, web-build]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0
          run_install: false
      - name: Restore pnpm store
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download same-run Web candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-candidate-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify Web candidate before browser resources
        run: node scripts/ci/build-artifact.mjs verify web
      - name: Install Web browsers
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          pnpm --filter @imsweb/web exec playwright install --with-deps chromium
      - name: Test compiled Web candidate
        run: node scripts/testing/run-test-owner.mjs web browser --artifact=.ci-artifacts/web.json
      - name: Upload Web browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/imsweb-web-playwright
          if-no-files-found: ignore
          retention-days: 7

  api:
    name: Validate API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMS_TEST_DATABASE_URL: postgresql://imsweb:imsweb-test-password@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: imsweb
          POSTGRES_PASSWORD: imsweb-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=imsweb --dbname=postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0
          run_install: false

      - name: Restore pnpm store
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test API owner
        run: pnpm --filter @imsweb/api run test
        env:
          # This step runs the whole API test tree, which is what the API
          # thresholds were measured against. Filtered runs (the integration
          # lane's `test:assets`) must not be gated by them.
          IMS_TEST_COVERAGE_ENABLED: "true"

      - name: Upload API reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/api/reports/junit-api.xml
            apps/api/coverage
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Validate Web and API integration
    needs: [changes, web-build]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0
          run_install: false

      - name: Restore pnpm store
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download same-run Web candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-candidate-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test Web routing and packaged asset contracts
        run: node scripts/testing/run-test-owner.mjs delivery integration --artifact=.ci-artifacts/web.json

  result:
    name: Validate repository
    if: always()
    needs:
      - changes
      - repository
      - app
      - web
      - web-build
      - web-browser
      - api
      - integration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify selected jobs succeeded
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REPOSITORY_SELECTED: ${{ needs.changes.outputs.repo }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          APP_SELECTED: ${{ needs.changes.outputs.app }}
          APP_RESULT: ${{ needs.app.result }}
          WEB_SELECTED: ${{ needs.changes.outputs.web }}
          WEB_RESULT: ${{ needs.web.result }}
          WEB_BUILD_SELECTED: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.integration == 'true' }}
          WEB_BUILD_RESULT: ${{ needs.web-build.result }}
          WEB_BROWSER_RESULT: ${{ needs.web-browser.result }}
          API_SELECTED: ${{ needs.changes.outputs.api }}
          API_RESULT: ${{ needs.api.result }}
          INTEGRATION_SELECTED: ${{ needs.changes.outputs.integration }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Affected-workspace detection did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi

          verify_lane() {
            local name="$1"
            local selected="$2"
            local result="$3"

            case "$result" in
              success|skipped) ;;
              *)
                echo "$name validation did not succeed: $result" >&2
                return 1
                ;;
            esac

            if [[ "$selected" == "true" && "$result" == "success" ]]; then
              return 0
            fi
            if [[ "$selected" == "false" && "$result" == "skipped" ]]; then
              return 0
            fi

            echo "$name validation selection/result mismatch: $selected/$result" >&2
            return 1
          }

          verify_lane repository "$REPOSITORY_SELECTED" "$REPOSITORY_RESULT"
          verify_lane app "$APP_SELECTED" "$APP_RESULT"
          verify_lane web "$WEB_SELECTED" "$WEB_RESULT"
          verify_lane web-build "$WEB_BUILD_SELECTED" "$WEB_BUILD_RESULT"
          verify_lane web-browser "$WEB_SELECTED" "$WEB_BROWSER_RESULT"
          verify_lane api "$API_SELECTED" "$API_RESULT"
          verify_lane integration "$INTEGRATION_SELECTED" "$INTEGRATION_RESULT"

  preview:
    name: Publish verified preview candidate
    needs: result
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/release/v1.1' &&
      github.event.repository.full_name == github.repository && needs.result.result == 'success'
    uses: ./.github/workflows/deploy-preview.yml
    secrets:
      PREVIEW_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_DEPLOY_SSH_PRIVATE_KEY }}
      PREVIEW_DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_DEPLOY_SSH_KNOWN_HOSTS }}
    permissions:
      contents: read
      actions: read
      packages: write
      attestations: write
      id-token: write
