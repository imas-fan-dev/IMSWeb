name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected workspaces
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      repo: ${{ steps.affected.outputs.repo }}
      app: ${{ steps.affected.outputs.app }}
      web: ${{ steps.affected.outputs.web }}
      api: ${{ steps.affected.outputs.api }}
      integration: ${{ steps.affected.outputs.integration }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Detect affected workspaces
        id: affected
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/detect-affected-workspaces.mjs

  repository:
    name: Validate repository and infrastructure
    needs: changes
    if: needs.changes.outputs.repo == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks
        run: pnpm run check:root

      - name: Test repository Node contracts
        run: >-
          node --experimental-strip-types --test
          tests/development-environment.test.js
          tests/exchange-map-assets.test.js
          tests/ci-affected-workspaces.test.js

      - name: Test repository Python contracts
        run: >-
          python3 -m unittest
          tests/test_agent_rules.py
          tests/test_source_rules.py
          tests/test_docs.py
          tests/test_git_hooks.py
          tests/test_release_activation.py
          tests/test_github_deployment.py
          tests/test_operations_docs.py
          tests/test_compose_deployment.py
          tests/test_workspace_boundaries.py

  app:
    name: Validate App
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Tauri contracts
        run: >-
          node --experimental-strip-types --test
          tests/tauri-build-configuration.test.js
          tests/tauri-device-delivery.test.js

      - name: Test App build scripts
        run: pnpm --filter @imsweb/web run test:unit tests/unit/scripts/build-app.test.ts

      - name: Install App browsers
        run: pnpm --filter @imsweb/web exec playwright install --with-deps chromium webkit

      - name: Build App target
        run: pnpm --filter @imsweb/web run build:app

      - name: Test App in browsers
        run: pnpm --filter @imsweb/web run test:e2e:app

  web:
    name: Validate Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Web
        run: pnpm --filter @imsweb/web run check

      - name: Test public assets
        run: python3 -m unittest tests/test_public_assets.py

  api:
    name: Validate API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMS_TEST_DATABASE_URL: postgresql://imsweb:imsweb-test-password@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: imsweb
          POSTGRES_PASSWORD: imsweb-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=imsweb --dbname=postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check API
        run: pnpm --filter @imsweb/api run check

      - name: Test Node API runtime
        run: pnpm --filter @imsweb/api run test:node

      - name: Test API server
        run: pnpm --filter @imsweb/api run test:server

      - name: Test Wiki API
        run: pnpm --filter @imsweb/api run test:wiki

      - name: Test migrations
        run: pnpm --filter @imsweb/api run test:migration

  integration:
    name: Validate Web and API integration
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Web routing contract
        run: pnpm run test:web-routing

      - name: Check packaged Web assets
        run: pnpm --filter @imsweb/api run check:assets

  result:
    name: Validate repository
    if: always()
    needs:
      - changes
      - repository
      - app
      - web
      - api
      - integration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify selected jobs succeeded
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REPOSITORY_SELECTED: ${{ needs.changes.outputs.repo }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          APP_SELECTED: ${{ needs.changes.outputs.app }}
          APP_RESULT: ${{ needs.app.result }}
          WEB_SELECTED: ${{ needs.changes.outputs.web }}
          WEB_RESULT: ${{ needs.web.result }}
          API_SELECTED: ${{ needs.changes.outputs.api }}
          API_RESULT: ${{ needs.api.result }}
          INTEGRATION_SELECTED: ${{ needs.changes.outputs.integration }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Affected-workspace detection did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi

          verify_lane() {
            local name="$1"
            local selected="$2"
            local result="$3"

            case "$result" in
              success|skipped) ;;
              *)
                echo "$name validation did not succeed: $result" >&2
                return 1
                ;;
            esac

            if [[ "$selected" == "true" && "$result" == "success" ]]; then
              return 0
            fi
            if [[ "$selected" == "false" && "$result" == "skipped" ]]; then
              return 0
            fi

            echo "$name validation selection/result mismatch: $selected/$result" >&2
            return 1
          }

          verify_lane repository "$REPOSITORY_SELECTED" "$REPOSITORY_RESULT"
          verify_lane app "$APP_SELECTED" "$APP_RESULT"
          verify_lane web "$WEB_SELECTED" "$WEB_RESULT"
          verify_lane api "$API_SELECTED" "$API_RESULT"
          verify_lane integration "$INTEGRATION_SELECTED" "$INTEGRATION_RESULT"
