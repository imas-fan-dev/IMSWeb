name: Deploy production

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to deploy, for example v1.2.3
        required: true
        type: string
      confirm_data_compatibility:
        description: I confirm this release is compatible with current production data
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      image_name: ${{ steps.release.outputs.image_name }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
          CONFIRM_DATA_COMPATIBILITY: ${{ inputs.confirm_data_compatibility }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$MANUAL_TAG"
            if [[ "$CONFIRM_DATA_COMPATIBILITY" != "true" ]]; then
              echo "Manual deployment requires data compatibility confirmation." >&2
              exit 1
            fi
          else
            release_tag="$EVENT_TAG"
          fi

          if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use stable SemVer syntax: vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git fetch --force origin "refs/tags/${release_tag}:refs/tags/${release_tag}"
          release_sha="$(git rev-parse "refs/tags/${release_tag}^{commit}")"

          if [[ "$EVENT_NAME" == "push" && "$release_sha" != "$EVENT_SHA" ]]; then
            echo "Release tag changed after the workflow event was created." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$release_sha" refs/remotes/origin/main; then
            echo "Release tag must point to a commit contained in origin/main." >&2
            exit 1
          fi

          image_name="ghcr.io/${REPOSITORY,,}-api"
          if [[ ! "$image_name" =~ ^ghcr\.io/[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo "Resolved image name is not a valid lowercase GHCR repository." >&2
            exit 1
          fi

          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  publish:
    name: Test and publish image
    if: github.event_name == 'push'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
      IMS_TEST_DATABASE_URL: postgresql://imsweb:imsweb-test-password@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: imsweb
          POSTGRES_PASSWORD: imsweb-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=imsweb --dbname=postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static and architecture checks
        run: pnpm run check

      - name: Run repository tests
        run: pnpm run test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.release_tag }}
            ${{ env.IMAGE_NAME }}:sha-${{ needs.prepare.outputs.release_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.release_tag }}
          cache-from: type=gha,scope=imsweb-api
          cache-to: type=gha,mode=max,scope=imsweb-api

      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  resolve-image:
    name: Resolve immutable image
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success')
    needs:
      - prepare
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image digest
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          PUBLISHED_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          tagged_image="${IMAGE_NAME}:${RELEASE_TAG}"
          commit_image="${IMAGE_NAME}:sha-${RELEASE_SHA}"
          tagged_inspection="$(docker buildx imagetools inspect "$tagged_image")"
          commit_inspection="$(docker buildx imagetools inspect "$commit_image")"
          digest="$(awk '$1 == "Digest:" { print $2; exit }' <<< "$tagged_inspection")"
          commit_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<< "$commit_inspection")"

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve an immutable digest for $tagged_image" >&2
            exit 1
          fi
          if [[ "$digest" != "$commit_digest" ]]; then
            echo "Release tag and commit image tags do not resolve to the same digest." >&2
            exit 1
          fi
          if [[ -n "$PUBLISHED_DIGEST" && "$digest" != "$PUBLISHED_DIGEST" ]]; then
            echo "Published digest differs from the registry digest." >&2
            exit 1
          fi

          verified=false
          for _ in {1..5}; do
            if gh attestation verify "oci://${IMAGE_NAME}@${digest}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deploy.yml" \
              --source-digest "$RELEASE_SHA" \
              --source-ref "refs/tags/${RELEASE_TAG}" \
              --deny-self-hosted-runners; then
              verified=true
              break
            fi
            sleep 2
          done
          if [[ "$verified" != "true" ]]; then
            echo "Image provenance verification failed." >&2
            exit 1
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy production
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.resolve-image.result == 'success'
    needs:
      - prepare
      - resolve-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: ${{ vars.PUBLIC_BASE_URL }}
    concurrency:
      group: imsweb-production
      cancel-in-progress: false
    steps:
      - name: Check out release deployment files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false

      - name: Check out deployment transport
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .deployment-workflow
          persist-credentials: false
          sparse-checkout: scripts/deployment/run-authenticated-compose-release.sh
          sparse-checkout-cone-mode: false

      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set production variable DEPLOY_HOST}"
          : "${DEPLOY_ROOT:?Set production variable DEPLOY_ROOT}"
          : "${DEPLOY_USER:?Set production variable DEPLOY_USER}"
          : "${PUBLIC_BASE_URL:?Set production variable PUBLIC_BASE_URL}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?Set production secret DEPLOY_SSH_PRIVATE_KEY}"
          : "${DEPLOY_SSH_KNOWN_HOSTS:?Set production secret DEPLOY_SSH_KNOWN_HOSTS}"

          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid DEPLOY_HOST" >&2; exit 1; }
          [[ "${DEPLOY_PORT:-22}" =~ ^[0-9]{1,5}$ ]] || { echo "Invalid DEPLOY_PORT" >&2; exit 1; }
          (( ${DEPLOY_PORT:-22} >= 1 && ${DEPLOY_PORT:-22} <= 65535 )) || { echo "Invalid DEPLOY_PORT" >&2; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "Invalid DEPLOY_USER" >&2; exit 1; }
          deploy_root_segments="/${DEPLOY_ROOT#/}/"
          [[ "$DEPLOY_ROOT" =~ ^/[A-Za-z0-9._/-]+$ && "$DEPLOY_ROOT" != "/" &&
              "$deploy_root_segments" != *"/../"* && "$deploy_root_segments" != *"/./"* &&
              "$deploy_root_segments" != *"//"* ]] || { echo "Invalid DEPLOY_ROOT" >&2; exit 1; }

          node -e '
            const value = process.env.PUBLIC_BASE_URL;
            const url = new URL(value);
            if (url.protocol !== "https:" || url.username || url.password ||
                url.search || url.hash || url.pathname !== "/") process.exit(1);
          ' || { echo "PUBLIC_BASE_URL must be an HTTPS origin without a path, query, or credentials" >&2; exit 1; }

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/imsweb_deploy"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/imsweb_deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy immutable release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          IMAGE_REF: ${{ needs.resolve-image.outputs.image_ref }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_compose="/tmp/imsweb-compose-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.yaml"
          remote_script="/tmp/imsweb-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          remote_auth_script="/tmp/imsweb-auth-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          deployment_log="$RUNNER_TEMP/imsweb-deployment-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          ssh_options=(-i "$HOME/.ssh/imsweb_deploy" -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp_options=(-i "$HOME/.ssh/imsweb_deploy" -P "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes)

          cleanup() {
            ssh "${ssh_options[@]}" "$target" \
              "rm -f -- '$remote_compose' '$remote_script' '$remote_auth_script'" \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          scp "${scp_options[@]}" deploy/compose.yaml "$target:$remote_compose"
          scp "${scp_options[@]}" scripts/deployment/deploy-compose-release.sh \
            "$target:$remote_script"
          scp "${scp_options[@]}" \
            .deployment-workflow/scripts/deployment/run-authenticated-compose-release.sh \
            "$target:$remote_auth_script"
          public_base_url_base64="$(printf '%s' "$PUBLIC_BASE_URL" | base64 | tr -d '\n')"
          remote_command="test -f '$remote_auth_script' && test ! -L '$remote_auth_script' && bash '$remote_auth_script' '$GHCR_USERNAME' '$remote_script' '$RELEASE_TAG' '$RELEASE_SHA' '$IMAGE_REF' '$remote_compose' '$DEPLOY_ROOT' '$public_base_url_base64'"
          printf '%s' "$GHCR_TOKEN" | \
            ssh "${ssh_options[@]}" "$target" "$remote_command" | tee "$deployment_log"

          if ! grep -Fxq "Deployment completed." "$deployment_log"; then
            echo "Remote deployment did not emit its completion marker." >&2
            exit 1
          fi

      - name: Verify public deployment from GitHub
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          base="${PUBLIC_BASE_URL%/}"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$base/api/wiki/test" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$base/api/news" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$base/" >/dev/null

      - name: Write deployment summary
        env:
          DIGEST: ${{ needs.resolve-image.outputs.digest }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Release: \`$RELEASE_TAG\`"
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Image digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
