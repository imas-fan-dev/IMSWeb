name: Deploy preview

on:
  push:
    branches:
      - release/v1.1
  workflow_dispatch:
    inputs:
      confirm_preview_deploy:
        description: I confirm this run should deploy the current release/v1.1 commit to preview
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve preview commit
    if: github.event_name == 'push' || inputs.confirm_preview_deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      image_name: ${{ steps.preview.outputs.image_name }}
      preview_id: ${{ steps.preview.outputs.preview_id }}
      release_sha: ${{ steps.preview.outputs.release_sha }}
      source_branch: ${{ steps.preview.outputs.source_branch }}
    steps:
      - name: Check out preview commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate preview source
        id: preview
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          source_branch="release/v1.1"
          expected_ref="refs/heads/${source_branch}"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "Preview deployments must run from $expected_ref." >&2
            exit 1
          fi

          release_sha="$(git rev-parse HEAD)"
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ || "$release_sha" != "$GITHUB_SHA" ]]; then
            echo "Could not resolve the exact preview commit." >&2
            exit 1
          fi

          image_name="ghcr.io/${REPOSITORY,,}-api"
          if [[ ! "$image_name" =~ ^ghcr\.io/[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo "Resolved image name is not a valid lowercase GHCR repository." >&2
            exit 1
          fi

          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"
          echo "preview_id=preview-${release_sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "source_branch=$source_branch" >> "$GITHUB_OUTPUT"

  publish:
    name: Test and publish preview image
    if: github.event_name == 'push'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: imsweb-preview-build
      cancel-in-progress: true
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
      IMS_TEST_DATABASE_URL: postgresql://imsweb:imsweb-test-password@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: imsweb
          POSTGRES_PASSWORD: imsweb-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=imsweb --dbname=postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out preview commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static and architecture checks
        run: pnpm run check

      - name: Run repository tests
        run: pnpm run test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable preview image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:preview-sha-${{ needs.prepare.outputs.release_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.preview_id }}
          cache-from: type=gha,scope=imsweb-api
          cache-to: type=gha,mode=max,scope=imsweb-api

      - name: Attest preview image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  resolve-image:
    name: Verify immutable preview image
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success')
    needs:
      - prepare
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and verify image digest
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_DIGEST: ${{ needs.publish.outputs.digest }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          SOURCE_BRANCH: ${{ needs.prepare.outputs.source_branch }}
        run: |
          set -euo pipefail
          tagged_image="${IMAGE_NAME}:preview-sha-${RELEASE_SHA}"
          tagged_inspection="$(docker buildx imagetools inspect "$tagged_image")"
          digest="$(awk '$1 == "Digest:" { print $2; exit }' <<< "$tagged_inspection")"

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve an immutable digest for $tagged_image." >&2
            exit 1
          fi
          if [[ -n "$PUBLISHED_DIGEST" && "$digest" != "$PUBLISHED_DIGEST" ]]; then
            echo "Published preview digest differs from the registry digest." >&2
            exit 1
          fi

          verified=false
          for _ in {1..5}; do
            if gh attestation verify "oci://${IMAGE_NAME}@${digest}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deploy-preview.yml" \
              --source-digest "$RELEASE_SHA" \
              --source-ref "refs/heads/${SOURCE_BRANCH}" \
              --deny-self-hosted-runners; then
              verified=true
              break
            fi
            sleep 2
          done
          if [[ "$verified" != "true" ]]; then
            echo "Preview image provenance verification failed." >&2
            exit 1
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy preview
    needs:
      - prepare
      - resolve-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: preview
    concurrency:
      group: imsweb-preview
      cancel-in-progress: false
    steps:
      - name: Check out preview deployment files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false

      - name: Check out deployment transport
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .deployment-workflow
          persist-credentials: false
          sparse-checkout: scripts/deployment/run-authenticated-compose-release.sh
          sparse-checkout-cone-mode: false

      - name: Validate preview deployment configuration
        env:
          PREVIEW_API_PORT: ${{ vars.PREVIEW_API_PORT }}
          PREVIEW_DEPLOY_HOST: ${{ vars.PREVIEW_DEPLOY_HOST }}
          PREVIEW_DEPLOY_PORT: ${{ vars.PREVIEW_DEPLOY_PORT }}
          PREVIEW_DEPLOY_ROOT: ${{ vars.PREVIEW_DEPLOY_ROOT }}
          PREVIEW_DEPLOY_USER: ${{ vars.PREVIEW_DEPLOY_USER }}
          PREVIEW_SOURCE_BRANCH: ${{ vars.PREVIEW_SOURCE_BRANCH }}
          PREVIEW_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_DEPLOY_SSH_PRIVATE_KEY }}
          PREVIEW_DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_DEPLOY_SSH_KNOWN_HOSTS }}
          RESOLVED_SOURCE_BRANCH: ${{ needs.prepare.outputs.source_branch }}
        run: |
          set -euo pipefail
          : "${PREVIEW_DEPLOY_HOST:?Set preview variable PREVIEW_DEPLOY_HOST}"
          : "${PREVIEW_DEPLOY_PORT:?Set preview variable PREVIEW_DEPLOY_PORT}"
          : "${PREVIEW_DEPLOY_ROOT:?Set preview variable PREVIEW_DEPLOY_ROOT}"
          : "${PREVIEW_DEPLOY_USER:?Set preview variable PREVIEW_DEPLOY_USER}"
          : "${PREVIEW_SOURCE_BRANCH:?Set preview variable PREVIEW_SOURCE_BRANCH}"
          : "${PREVIEW_API_PORT:?Set preview variable PREVIEW_API_PORT}"
          : "${PREVIEW_DEPLOY_SSH_PRIVATE_KEY:?Set preview secret PREVIEW_DEPLOY_SSH_PRIVATE_KEY}"
          : "${PREVIEW_DEPLOY_SSH_KNOWN_HOSTS:?Set preview secret PREVIEW_DEPLOY_SSH_KNOWN_HOSTS}"

          [[ "$PREVIEW_DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid PREVIEW_DEPLOY_HOST" >&2; exit 1; }
          [[ "$PREVIEW_DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "Invalid PREVIEW_DEPLOY_PORT" >&2; exit 1; }
          (( PREVIEW_DEPLOY_PORT >= 1 && PREVIEW_DEPLOY_PORT <= 65535 )) || { echo "Invalid PREVIEW_DEPLOY_PORT" >&2; exit 1; }
          [[ "$PREVIEW_DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "Invalid PREVIEW_DEPLOY_USER" >&2; exit 1; }
          [[ "$PREVIEW_DEPLOY_ROOT" == "/home/$PREVIEW_DEPLOY_USER/"* ]] || { echo "PREVIEW_DEPLOY_ROOT must stay under the deployment user home" >&2; exit 1; }
          [[ "$PREVIEW_SOURCE_BRANCH" == "release/v1.1" && "$RESOLVED_SOURCE_BRANCH" == "$PREVIEW_SOURCE_BRANCH" ]] || { echo "Preview source branch configuration differs from release/v1.1" >&2; exit 1; }
          [[ "$PREVIEW_API_PORT" =~ ^[0-9]+$ ]] && (( PREVIEW_API_PORT >= 1024 && PREVIEW_API_PORT <= 65535 )) || { echo "Invalid PREVIEW_API_PORT" >&2; exit 1; }

      - name: Configure SSH
        env:
          PREVIEW_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.PREVIEW_DEPLOY_SSH_PRIVATE_KEY }}
          PREVIEW_DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$PREVIEW_DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/imsweb_preview_deploy"
          printf '%s\n' "$PREVIEW_DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/imsweb_preview_deploy" "$HOME/.ssh/known_hosts"

      - name: Check preview commit freshness
        id: freshness
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          SOURCE_BRANCH: ${{ needs.prepare.outputs.source_branch }}
        run: |
          set -euo pipefail
          current_sha="$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/heads/$SOURCE_BRANCH" | awk '{ print $1 }')"
          if [[ "$current_sha" != "$RELEASE_SHA" ]]; then
            echo "Skipping stale preview commit $RELEASE_SHA; $SOURCE_BRANCH now points to $current_sha."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy immutable preview image
        id: deployment
        if: steps.freshness.outputs.deploy == 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          IMAGE_REF: ${{ needs.resolve-image.outputs.image_ref }}
          PREVIEW_DEPLOY_HOST: ${{ vars.PREVIEW_DEPLOY_HOST }}
          PREVIEW_DEPLOY_PORT: ${{ vars.PREVIEW_DEPLOY_PORT }}
          PREVIEW_DEPLOY_ROOT: ${{ vars.PREVIEW_DEPLOY_ROOT }}
          PREVIEW_DEPLOY_USER: ${{ vars.PREVIEW_DEPLOY_USER }}
          PREVIEW_ID: ${{ needs.prepare.outputs.preview_id }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          target="${PREVIEW_DEPLOY_USER}@${PREVIEW_DEPLOY_HOST}"
          remote_compose="/tmp/imsweb-preview-compose-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.yaml"
          remote_override="/tmp/imsweb-preview-override-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.yaml"
          remote_script="/tmp/imsweb-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          remote_auth_script="/tmp/imsweb-auth-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          deployment_log="$RUNNER_TEMP/imsweb-preview-deployment-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          ssh_options=(-i "$HOME/.ssh/imsweb_preview_deploy" -p "$PREVIEW_DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp_options=(-i "$HOME/.ssh/imsweb_preview_deploy" -P "$PREVIEW_DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)

          cleanup() {
            ssh "${ssh_options[@]}" "$target" \
              "rm -f -- '$remote_compose' '$remote_override' '$remote_script' '$remote_auth_script'" \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          scp "${scp_options[@]}" deploy/compose.yaml "$target:$remote_compose"
          scp "${scp_options[@]}" deploy/compose.preview.yaml "$target:$remote_override"
          scp "${scp_options[@]}" scripts/deployment/deploy-compose-preview.sh \
            "$target:$remote_script"
          scp "${scp_options[@]}" \
            .deployment-workflow/scripts/deployment/run-authenticated-compose-release.sh \
            "$target:$remote_auth_script"
          remote_command="test -f '$remote_auth_script' && test ! -L '$remote_auth_script' && bash '$remote_auth_script' '$GHCR_USERNAME' '$remote_script' '$PREVIEW_ID' '$RELEASE_SHA' '$IMAGE_REF' '$remote_compose' '$PREVIEW_DEPLOY_ROOT' '$remote_override'"
          printf '%s' "$GHCR_TOKEN" | \
            ssh "${ssh_options[@]}" "$target" "$remote_command" | tee "$deployment_log"

          if ! grep -Fxq "Preview deployment completed." "$deployment_log"; then
            echo "Remote preview deployment did not emit its completion marker." >&2
            exit 1
          fi

      - name: Verify preview over SSH
        id: verification
        if: steps.freshness.outputs.deploy == 'true'
        env:
          PREVIEW_API_PORT: ${{ vars.PREVIEW_API_PORT }}
          PREVIEW_DEPLOY_HOST: ${{ vars.PREVIEW_DEPLOY_HOST }}
          PREVIEW_DEPLOY_PORT: ${{ vars.PREVIEW_DEPLOY_PORT }}
          PREVIEW_DEPLOY_USER: ${{ vars.PREVIEW_DEPLOY_USER }}
        run: |
          set -euo pipefail
          target="${PREVIEW_DEPLOY_USER}@${PREVIEW_DEPLOY_HOST}"
          ssh_options=(-i "$HOME/.ssh/imsweb_preview_deploy" -p "$PREVIEW_DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_options[@]}" "$target" \
            "curl --fail --silent --show-error 'http://127.0.0.1:$PREVIEW_API_PORT/api/health/ready' >/dev/null && curl --fail --silent --show-error 'http://127.0.0.1:$PREVIEW_API_PORT/api/wiki/test' >/dev/null && curl --fail --silent --show-error 'http://127.0.0.1:$PREVIEW_API_PORT/api/news' >/dev/null && curl --fail --silent --show-error 'http://127.0.0.1:$PREVIEW_API_PORT/' >/dev/null"

      - name: Write deployment summary
        if: always()
        env:
          DIGEST: ${{ needs.resolve-image.outputs.digest }}
          PREVIEW_ID: ${{ needs.prepare.outputs.preview_id }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          VERIFICATION_OUTCOME: ${{ steps.verification.outcome }}
          WAS_CURRENT: ${{ steps.freshness.outputs.deploy }}
        run: |
          if [[ "$WAS_CURRENT" != "true" ]]; then
            status="skipped because a newer release/v1.1 commit exists"
          elif [[ "$DEPLOYMENT_OUTCOME" == "success" && "$VERIFICATION_OUTCOME" == "success" ]]; then
            status="deployed"
          else
            status="deployment or verification failed"
          fi
          {
            echo "## Preview deployment"
            echo
            echo "- Status: $status"
            echo "- Release: \`$PREVIEW_ID\`"
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Image digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
