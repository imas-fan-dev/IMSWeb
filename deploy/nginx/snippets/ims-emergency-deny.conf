# Temporary safety boundary enabled only through deploy/compose.emergency.yaml when
# rolling back to an application version that cannot authorize pending media.
# This intentionally disables all namecard media.
location ^~ /assets/images/eventchronicle/events/upload/ {
    deny all;
    return 404;
}

location ^~ /uploads/namecard/original/ {
    deny all;
    return 404;
}
