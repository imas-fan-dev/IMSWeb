# Included by the container site template before proxy locations. Keep this
# file active in every deployable and rollback image.

# Never expose application source, databases, secrets, logs, process files,
# backups, or package metadata through the application static fallback.
location ~* \.(?:db|sqlite|sqlite3)(?:-wal|-shm|-journal)?$ {
    deny all;
    return 404;
}

location ~* \.(?:py|pyc|pyo|log|pid|sock|key|pem|p12|crt|cer|psd|sql|txt|conf|ini|toml|ya?ml|bak|old|orig|swp|tar(?:\.gz)?|tgz|zip|7z)$ {
    deny all;
    return 404;
}

location ~* (?:^|/)(?:app\.py|gunicorn_conf\.py|requirements(?:-[^/]+)?\.txt|package(?:-lock)?\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|README(?:\.[^/]+)?|\.env(?:\.[^/]+)?)$ {
    deny all;
    return 404;
}

location ~* ^/(?:database|logs?|backups?|secrets?|node_modules|templates|\.git|\.venv|venv|[^/]+_venv)(?:/|$) {
    deny all;
    return 404;
}

# Story media remains available through Hono's /image route. Direct access
# would bypass its path mapping and should stay closed.
location ^~ /Data/ {
    deny all;
    return 404;
}

# Pending submissions are protected by Hono authentication so the existing
# review UI can load them. JSON workflow state must never be a public asset.
location ^~ /assets/images/eventchronicle/events/meta/ {
    deny all;
    return 404;
}
