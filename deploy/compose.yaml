name: imsweb

services:
  nginx:
    image: ${IMS_NGINX_IMAGE:-nginx:1.30.4-alpine3.24}
    entrypoint: /docker-entrypoint.sh
    network_mode: host
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      IMS_NGINX_LISTEN_PORT: ${IMS_NGINX_LISTEN_PORT:-8080}
      IMS_NGINX_SERVER_NAME: ${IMS_NGINX_SERVER_NAME:-_}
      IMS_NODE_UPSTREAM: ${IMS_NODE_UPSTREAM:-127.0.0.1:3000}
      IMS_CLIENT_MAX_BODY_SIZE: ${IMS_CLIENT_MAX_BODY_SIZE:-50m}
      IMS_EMERGENCY_INCLUDE: /etc/nginx/snippets/ims-normal-mode.conf
      NGINX_ENVSUBST_FILTER: ^IMS_
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    tmpfs:
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m,mode=0755
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,mode=0755
      - /var/run:rw,noexec,nosuid,size=1m,mode=0755
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null "http://127.0.0.1:$${IMS_NGINX_LISTEN_PORT}/readyz" || exit 1
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
