<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1260" viewBox="0 0 1460 1260" role="img" aria-labelledby="title desc">
  <title id="title">Web 与 App 交换地图底部查找结构提案</title>
  <desc id="desc">三个 390×844 视口：Web 大圆角折叠搜索卡片、iOS 展开结果、iOS 选点后折叠。Web 搜索为胶囊形，定位与更多为圆形。移除地图内标题栏，保留网站顶栏；App 折叠时保留标签栏。玻璃色块与结果是示意，不能证明运行效果。</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="0.6" stop-color="#f4fbff" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#dcebf2" stop-opacity="0.94"/>
    </linearGradient>
    <filter id="web-panel-shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#233f4f" flood-opacity="0.08"/>
    </filter>
  </defs>
  <style>
    text { font-family: "PingFang SC", "Noto Sans SC", sans-serif; fill: #252a33; }
    .heading { font-size: 28px; font-weight: 600; }
    .label { font-size: 18px; font-weight: 600; }
    .body { font-size: 16px; }
    .small { font-size: 13px; }
    .muted { fill: #687481; }
    .surface { fill: #ffffff; stroke: #d8dfe5; stroke-width: 1; }
    .web-panel { fill: #ffffff; stroke: #e3e9ed; stroke-width: 1; filter: url(#web-panel-shadow); }
    .glass { fill: url(#glass); stroke: #ffffff; stroke-width: 2; }
    .rule { stroke: #d8dfe5; stroke-width: 1; }
    .accent { fill: #b52577; }
  </style>
  <rect width="1460" height="1260" fill="#f4f6f8"/>
  <text x="40" y="55" class="heading">交换地图：常驻底部查找卡片</text>
  <text x="40" y="88" class="body muted">Apple Maps 风格的伸缩与结果浏览，覆盖 Web 和 App。结构示意，待审阅。</text>
  <text x="40" y="145" class="label">Web · 圆润折叠卡片</text>
  <g transform="translate(40 168)">
    <rect width="390" height="844" rx="10" fill="#e8f2f4" stroke="#b9c8d2"/>
    <path d="M10 0 H380 Q390 0 390 10 V64 H0 V10 Q0 0 10 0" fill="#ffffff"/>
    <line x1="0" y1="64" x2="390" y2="64" class="rule"/>
    <text x="16" y="39" class="body">现有网站标识</text>
    <text x="245" y="39" class="small muted">账号 / 主题 / 导航</text>
    <text x="195" y="370" text-anchor="middle" class="label muted">地图浏览区域</text>
    <text x="195" y="398" text-anchor="middle" class="small muted">无地图标题栏与成功统计浮层</text>
    <rect x="334" y="632" width="44" height="44" rx="22" class="surface"/>
    <text x="356" y="658" text-anchor="middle" class="small">定位</text>
    <rect x="12" y="688" width="366" height="144" rx="28" class="web-panel"/>
    <rect x="175" y="698" width="40" height="4" rx="2" fill="#a7b4bd"/>
    <rect x="24" y="714" width="286" height="48" rx="24" fill="#f1f4f6"/>
    <circle cx="43" cy="736" r="6" fill="none" stroke="#687481" stroke-width="2"/>
    <line x1="48" y1="741" x2="53" y2="746" stroke="#687481" stroke-width="2"/>
    <text x="63" y="744" class="body muted">查找地点</text>
    <rect x="318" y="716" width="44" height="44" rx="22" fill="#f1f4f6"/>
    <text x="340" y="743" text-anchor="middle" class="small">更多</text>
    <rect x="28" y="776" width="106" height="44" rx="22" fill="#f4f6f8"/>
    <rect x="142" y="776" width="106" height="44" rx="22" fill="#f4f6f8"/>
    <rect x="256" y="776" width="106" height="44" rx="22" fill="#f4f6f8"/>
    <text x="81" y="803" text-anchor="middle" class="body">筛选</text>
    <text x="195" y="803" text-anchor="middle" class="body">事务所</text>
    <text x="309" y="803" text-anchor="middle" class="body">名片</text>
  </g>

  <text x="510" y="145" class="label">iOS · 结果展开</text>
  <g transform="translate(510 168)">
    <rect width="390" height="844" rx="24" fill="#e8f2f4" stroke="#b9c8d2"/>
    <text x="24" y="30" class="small">9:41</text>
    <rect x="16" y="52" width="44" height="44" rx="22" class="glass"/>
    <text x="38" y="79" text-anchor="middle" class="small">返回</text>
    <text x="195" y="253" text-anchor="middle" class="label muted">可继续浏览地图</text>
    <text x="195" y="282" text-anchor="middle" class="small muted">卡片外无模态遮罩</text>
    <rect x="12" y="392" width="366" height="440" rx="28" class="glass"/>
    <rect x="175" y="402" width="40" height="4" rx="2" fill="#a7b4bd"/>
    <text x="28" y="435" class="label">地点查找</text>
    <rect x="314" y="412" width="48" height="44" rx="18" fill="#e5edf1"/>
    <text x="338" y="439" text-anchor="middle" class="small">收起</text>
    <rect x="28" y="470" width="254" height="48" rx="16" fill="#e5edf1"/>
    <text x="43" y="499" class="body muted">搜索文字（占位）</text>
    <rect x="290" y="470" width="72" height="48" rx="16" fill="#b52577"/>
    <text x="326" y="499" text-anchor="middle" class="body" style="fill:#ffffff">查找</text>
    <path d="M13 534 H377 V804 Q377 831 350 831 H40 Q13 831 13 804 Z" fill="#fbfcfd"/>
    <text x="28" y="564" class="small muted">搜索结果 · 内容来自现有地点服务</text>
    <text x="28" y="607" class="body">地点结果名称</text>
    <text x="28" y="632" class="small muted">地址与地区（真实结果占位）</text>
    <line x1="28" y1="650" x2="362" y2="650" class="rule"/>
    <text x="28" y="679" class="body">地点结果名称</text>
    <text x="28" y="704" class="small muted">选点后定位地图并收起结果</text>
    <line x1="28" y1="722" x2="362" y2="722" class="rule"/>
    <text x="28" y="752" class="small muted">上拉可查看更多 · 支持按钮展开</text>
    <text x="28" y="791" class="small muted">© OpenStreetMap contributors</text>
  </g>

  <text x="980" y="145" class="label">iOS · 选点后折叠</text>
  <g transform="translate(980 168)">
    <rect width="390" height="844" rx="24" fill="#e8f2f4" stroke="#b9c8d2"/>
    <text x="24" y="30" class="small">9:41</text>
    <rect x="16" y="52" width="44" height="44" rx="22" class="glass"/>
    <text x="38" y="79" text-anchor="middle" class="small">返回</text>
    <text x="195" y="315" text-anchor="middle" class="label muted">地图显示搜索标记</text>
    <text x="195" y="344" text-anchor="middle" class="small muted">地点定位与城市筛选保持独立</text>
    <rect x="334" y="488" width="44" height="44" rx="22" class="glass"/>
    <text x="356" y="515" text-anchor="middle" class="small">定位</text>
    <rect x="12" y="544" width="366" height="216" rx="28" class="glass"/>
    <rect x="175" y="554" width="40" height="4" rx="2" fill="#a7b4bd"/>
    <rect x="28" y="570" width="278" height="48" rx="16" fill="#e5edf1"/>
    <text x="44" y="599" class="body muted">查找地点</text>
    <rect x="314" y="572" width="44" height="44" rx="22" fill="#e5edf1"/>
    <text x="336" y="599" text-anchor="middle" class="small">更多</text>
    <text x="80" y="653" text-anchor="middle" class="body">筛选</text>
    <text x="195" y="653" text-anchor="middle" class="body">事务所</text>
    <text x="310" y="653" text-anchor="middle" class="body">名片</text>
    <line x1="28" y1="674" x2="362" y2="674" class="rule"/>
    <text x="28" y="704" class="body">选中地点名称</text>
    <text x="28" y="727" class="small muted">再次展开可回到搜索结果</text>
    <rect x="314" y="684" width="44" height="44" rx="22" fill="#e5edf1"/>
    <text x="336" y="711" text-anchor="middle" class="small">清除</text>
    <text x="28" y="748" class="small muted">© OpenStreetMap contributors</text>
    <rect x="12" y="772" width="366" height="52" rx="26" class="glass"/>
    <text x="195" y="804" text-anchor="middle" class="small muted">现有 App 标签栏 · 折叠时恢复</text>
    <rect x="136" y="834" width="118" height="4" rx="2" fill="#343b43"/>
  </g>

  <line x1="40" y1="1040" x2="1400" y2="1040" class="rule"/>
  <text x="40" y="1080" class="label">输入与键盘</text>
  <text x="40" y="1112" class="body muted">激活搜索后展开并聚焦输入、避让键盘；App 暂时隐藏标签栏。选点后保留摘要。</text>
  <text x="40" y="1150" class="label">窄窗口与短横屏</text>
  <text x="40" y="1182" class="body muted">Web 768 至 1023px 沿用同一卡片；短横屏靠左停靠，宽度不足时使用安全高度。</text>
  <text x="40" y="1220" class="small muted">iOS 26+ 采用原生 Liquid Glass；Android／旧 iOS 使用 Web 回退。图中玻璃色块仅说明表面分工。</text>
</svg>
